<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>星砂倖存者</title>
<style>
:root{
  --panel:#16171b; --panel2:#202127; --card:#1c1d22; --line:#3a3a42; --ink:#e4ded2; --mute:#958f84;
  --accent:#9b1c1c; --accent2:#c62828; --gold:#c9a24a; --red:#e53935; --green:#7cb342;
  --r0:#9e9e9e; --r1:#7cb342; --r2:#42a5f5; --r3:#ba68c8; --r4:#ffa726;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0d;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:1px solid #5a0f0f;background:linear-gradient(#a52323,#6e1212);color:#f3e9e0;border-radius:4px;padding:6px 14px;box-shadow:0 2px 0 #3a0808}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(1px);box-shadow:none}
button.ghost{background:#24252b;color:var(--ink);border-color:var(--line);box-shadow:0 2px 0 #0e0e10}
button.danger{background:linear-gradient(#5a5a5a,#333);border-color:#222;box-shadow:0 2px 0 #111}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.sm{padding:3px 9px;font-size:13px}
#ui{position:fixed;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px}
.win{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 50px rgba(0,0,0,.8),inset 0 0 60px rgba(0,0,0,.5);width:min(1000px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.win>.hd{background:linear-gradient(#2a1414,#160a0a);border-bottom:2px solid #7a1515;color:#e8d9c8;padding:9px 14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;font-family:Georgia,"PMingLiU","Noto Serif TC",serif}
.win>.hd .x{margin-left:auto}
.win>.bd{padding:14px;overflow:auto;flex:1}
.win>.ft{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel2)}
.logo{text-align:center;margin-bottom:14px;color:#cfc4b4;text-shadow:0 2px 8px #000}
.logo h1{margin:0;font-size:clamp(34px,7vw,66px);letter-spacing:8px;font-family:Georgia,"PMingLiU","Noto Serif TC",serif;background:linear-gradient(#e53935,#7f0000 70%,#3a0000);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 18px rgba(200,0,0,.45))}
.logo p{margin:4px 0 0;font-size:15px;letter-spacing:3px;opacity:.85}
.wrapcol{display:flex;flex-direction:column;align-items:center;width:min(1000px,100%)}
.grid{display:grid;gap:10px}
.slotgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cslot{border:2px dashed var(--line);border-radius:6px;padding:10px;text-align:center;min-height:120px;cursor:pointer;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cslot.on{border:2px solid var(--accent2);box-shadow:0 0 0 3px rgba(198,40,40,.25)}
.cslot.filled{border-style:solid}
.cslot canvas{width:56px;height:56px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px}
.town{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.npc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:transform .1s}
.npc:hover{transform:translateY(-2px);border-color:var(--accent2);box-shadow:0 0 14px rgba(198,40,40,.3)}
.npc .ic{font-size:30px;width:44px;text-align:center}
.npc b{display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#24252b;color:var(--ink);border-color:var(--line);box-shadow:none}
.tabs button.on{background:linear-gradient(#a52323,#6e1212);color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.two,.three{grid-template-columns:1fr}}
.eq{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--card);margin-bottom:6px;cursor:pointer}
.eq.on{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(198,40,40,.25)}
.eq .nm{font-weight:700}
.gs{font-size:12px;background:var(--panel2);border-radius:5px;padding:1px 6px;color:var(--mute);white-space:nowrap}
.up{color:var(--green);font-weight:700;font-size:12px}.dn{color:var(--red);font-weight:700;font-size:12px}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4);font-weight:800}
.it{border:1px solid var(--line);border-left:4px solid var(--r0);border-radius:5px;background:var(--card);padding:7px 9px;margin-bottom:6px}
.it.q1{border-left-color:var(--r1)}.it.q2{border-left-color:var(--r2)}.it.q3{border-left-color:var(--r3)}.it.q4{border-left-color:var(--r4);background:linear-gradient(90deg,#3a2510,var(--card) 45%)}
.it .l{font-size:12px;color:var(--mute)}
.stat{display:grid;grid-template-columns:56px 50px 1fr auto auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--panel2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--mute)}
.branch{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px}
.tn{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
.tn.lock{opacity:.45;cursor:not-allowed}
.tn.full{border-color:var(--gold);background:#2c2414}
.tn .rk{float:right;font-weight:700;color:var(--accent2)}
.pill{display:inline-block;background:var(--panel2);border-radius:20px;padding:2px 10px;font-size:13px}
.stage{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin-bottom:6px;cursor:pointer}
.stage.on{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(198,40,40,.3)}
.stage.lock{opacity:.55}
.stage canvas{width:44px;height:44px;flex:none}
.mons{display:flex;flex-wrap:wrap;gap:6px}
.mons .m{display:flex;flex-direction:column;align-items:center;font-size:12px;width:76px;text-align:center}
.mons canvas{width:48px;height:48px;background:var(--panel2);border-radius:8px}
input[type=range]{width:100%}
input[type=range]{accent-color:#c62828}
input[type=text],textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;width:100%;background:#101013;color:var(--ink)}
.clsopt{border:2px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;background:var(--card);text-align:center}
.clsopt.on{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(198,40,40,.25)}
.clsopt canvas{width:72px;height:72px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
#hud button{pointer-events:auto}
.hud-tl{position:absolute;left:10px;top:10px;display:flex;gap:8px;align-items:center;background:rgba(10,10,12,.78);padding:7px 10px 7px 7px;border-radius:6px;border:1px solid rgba(160,30,30,.5)}
.portrait{width:46px;height:46px;border-radius:50%;background:#2a2a2e;overflow:hidden;border:2px solid #7a1515}
.portrait canvas{width:46px;height:46px}
.bar{position:relative;width:190px;height:14px;background:rgba(0,0,0,.5);border-radius:7px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#8bc34a,#33691e)}
.bar.xp i{background:linear-gradient(#ffd54f,#a87c00)}
.bar span{position:absolute;inset:0;font-size:11px;line-height:14px;text-align:center;text-shadow:0 1px 1px #000}
.lvbadge{font-weight:800;font-size:15px;background:#7a1515;color:#f3e9e0;border-radius:4px;padding:2px 7px;align-self:flex-start}
.hud-tc{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center}
.timer{font-size:26px;font-weight:800;background:rgba(10,10,12,.78);border:1px solid rgba(160,30,30,.5);border-radius:4px;padding:2px 16px;display:inline-block;letter-spacing:3px;font-family:Consolas,"Courier New",monospace;color:#ff5252;text-shadow:0 0 8px rgba(255,0,0,.6)}
.chips{display:flex;gap:6px;justify-content:center;margin-top:5px;font-size:13px}
.chips span{background:rgba(10,10,12,.78);padding:2px 9px;border-radius:4px}
.bossbar{margin-top:6px;width:min(420px,80vw)}
.bossbar .bar{width:100%;height:12px}
.bossbar .bar i{background:linear-gradient(#ff8a7a,#d9483b)}
.bossbar span{font-size:13px;font-weight:700;text-shadow:0 1px 2px #000}
.hud-tr{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center;font-size:13px}
.hud-tr>span{background:rgba(10,10,12,.78);padding:4px 9px;border-radius:4px}
.hud-map{position:absolute;right:10px;top:46px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:auto}
#mm{width:150px;height:150px;border-radius:50%;border:2px solid #5a1a1a;background:rgba(8,8,10,.8);box-shadow:0 0 12px rgba(0,0,0,.8);cursor:pointer}
.zoomrow{display:flex;align-items:center;gap:6px;background:rgba(10,10,12,.78);border-radius:4px;padding:2px 4px;font-size:12px}
.zoomrow span{width:38px;text-align:center}
.zoomrow button{width:28px;padding:2px 0}
@media (max-width:600px){#mm{width:104px;height:104px}.hud-map{top:44px}
  .hud-tc{top:78px;left:10px;transform:none;text-align:left}.hud-tc .chips{justify-content:flex-start;flex-wrap:wrap;max-width:calc(100vw - 150px)}
  .bossbar{width:calc(100vw - 150px)}.timer{font-size:22px}}
.hud-b{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px}
.slots{display:flex;gap:5px}
.sk{position:relative;width:46px;height:46px;border-radius:5px;background:rgba(30,30,34,.92);border:2px solid #5a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;color:#eee}
.sk.empty{background:rgba(30,30,34,.4);border-style:dashed}
.sk .cdv{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65)}
.sk .lv{position:absolute;right:2px;bottom:0;font-size:11px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
.slots.small .sk{width:32px;height:32px;font-size:15px;border-radius:7px}
.slots.small .sk .lv{font-size:10px}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(20px,4vw,34px);font-weight:800;letter-spacing:2px;font-family:Georgia,"PMingLiU","Noto Serif TC",serif;color:#fff;text-shadow:0 2px 0 #000,0 0 22px rgba(200,0,0,.9);opacity:0;transition:opacity .3s;white-space:nowrap}
#banner.show{opacity:1}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.lvup{text-align:center;color:#eee;width:min(820px,100%)}
.lvup h2{font-size:34px;margin:0;letter-spacing:3px;font-family:Georgia,"PMingLiU","Noto Serif TC",serif;color:#ffd54f;text-shadow:0 2px 0 #000,0 0 16px rgba(255,180,0,.4)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.choice{background:linear-gradient(#24252b,#17181c);color:var(--ink);border:2px solid #3e3e46;border-radius:6px;padding:14px;cursor:pointer;position:relative;text-align:center;transition:transform .1s}
.choice:hover{transform:translateY(-3px);border-color:var(--accent2);box-shadow:0 0 18px rgba(198,40,40,.35)}
.choice .ic{font-size:38px;width:64px;height:64px;margin:6px auto;border-radius:50%;background:#101013;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.choice .tag{position:absolute;left:10px;top:8px;font-size:12px;background:#5a1a1a;color:#fff;border-radius:3px;padding:1px 7px}
.choice .new{position:absolute;right:10px;top:8px;font-size:12px;background:var(--red);color:#fff;border-radius:3px;padding:1px 7px}
.choice .num{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:#7a1515;color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:22px}
.choice p{font-size:14px;margin:6px 0 4px;color:var(--mute);min-height:40px}
.ownrow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
#joy{position:fixed;pointer-events:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,10,10,.95);border:1px solid #7a1515;color:#fff;padding:8px 16px;border-radius:10px;z-index:99;font-size:14px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="hud" class="hidden">
  <div class="hud-tl">
    <div class="portrait"><canvas id="hPort" width="92" height="92"></canvas></div>
    <div>
      <div id="hName" style="font-size:13px;font-weight:700"></div>
      <div class="bar hp"><i id="hHp"></i><span id="hHpT"></span></div>
      <div class="bar xp"><i id="hXp"></i><span id="hXpT"></span></div>
    </div>
    <div class="lvbadge" id="hLv">Lv 1</div>
  </div>
  <div class="hud-tc">
    <div id="hTime" class="timer">00:00</div>
    <div class="chips"><span>☠ <b id="hKills">0</b></span><span>🪙 <b id="hGold">0</b></span><span>寶箱 <b id="hChest">30</b></span><span title="敵人成長：血量倍率">👹 ×<b id="hGrow">1.0</b></span></div>
    <div id="hBoss" class="bossbar hidden"><span id="hBossN"></span><div class="bar"><i id="hBossHp"></i></div></div>
  </div>
  <div class="hud-tr"><span id="hStage"></span><button class="sm ghost" id="hMute" title="靜音切換">🔊</button><button class="sm" id="hPause">⏸ Esc</button></div>
  <div class="hud-map">
    <canvas id="mm" width="300" height="300" title="小地圖（點擊或按 M 切換範圍）"></canvas>
    <div class="zoomrow"><button class="sm ghost" id="hZout" title="拉遠（滾輪 / - / Q）">－</button><span id="hZoomV">100%</span><button class="sm ghost" id="hZin" title="拉近（滾輪 / + / E）">＋</button></div>
  </div>
  <div class="hud-b"><div id="hSkills" class="slots"></div><div id="hPass" class="slots small"></div></div>
  <div id="banner"></div>
</div>
<div id="modal" class="hidden"></div>

<script>
'use strict';
/* ============================== 工具 ============================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pc=x=>Math.round(x*100)+'%';
const fmtT=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function wpick(arr){let t=0;for(const o of arr)t+=o.w;let r=Math.random()*t;for(const o of arr){r-=o.w;if(r<=0)return o;}return arr[arr.length-1];}
function toast(msg,ms=1800){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}
let UID=Date.now()%100000;const uid=()=>(++UID).toString(36)+Math.random().toString(36).slice(2,6);

/* ============================== 資料 ============================== */
const STATS=[['str','STR','近戰攻擊'],['agi','AGI','移速、冷卻、迴避'],['vit','VIT','HP、回復、防禦'],['int','INT','魔法攻擊'],['dex','DEX','遠程攻擊、冷卻'],['luk','LUK','爆擊、爆擊傷害']];
const CLASSES={
  sword:{name:'劍士',color:'#4b5320',hair:'#3b2a1e',main:'melee',basic:'slash',weapon:'sword',start:{str:5,agi:3,vit:5,int:1,dex:2,luk:1},desc:'近身揮砍，血厚耐打。主屬性 STR / VIT。',aff:['whirl','lance','sanctuary','boomerang','focus']},
  bow:{name:'弓手',color:'#2c3a4d',hair:'#c9a86a',main:'ranged',basic:'shot',weapon:'bow',start:{str:1,agi:4,vit:3,int:1,dex:6,luk:2},desc:'遠距離射擊，爆擊與冷卻見長。主屬性 DEX / AGI。',aff:['dstrafe','arrowrain','boomerang','firebolt','focus']},
  mage:{name:'法師',color:'#b8b4ac',hair:'#1e1e24',main:'magic',basic:'orb',weapon:'staff',start:{str:1,agi:2,vit:3,int:7,dex:4,luk:1},desc:'元素魔法，範圍傷害高但身板脆弱。主屬性 INT / DEX。',aff:['firebolt','frostring','thunder','poison','sanctuary']},
};
const TYPE_NAME={melee:'近戰',ranged:'遠程',magic:'魔法',buff:'增益'};
// 技能：無等級上限，每次升級從 ups 中隨機抽一種增益並隨機數值
const SK={
  slash:{name:'斬擊',basic:1,type:'melee',icon:'⚔️',cd:0.8,m:1,cnt:1,ups:['dmg','count','area','cd'],txt:'向最近的敵人揮出劍弧，弧內敵人全部命中。'},
  shot:{name:'射擊',basic:1,type:'ranged',icon:'🏹',cd:0.6,m:0.9,cnt:1,pierce:0,ups:['dmg','count','pierce','cd'],txt:'向最近的敵人射箭。'},
  orb:{name:'魔力彈',basic:1,type:'magic',icon:'🔮',cd:0.85,m:1,cnt:1,ups:['dmg','count','cd'],txt:'發射會追蹤敵人的魔力彈。'},
  dstrafe:{name:'雙重射擊',type:'ranged',icon:'🎯',cd:1.5,m:0.75,cnt:1,pierce:1,ups:['dmg','count','pierce','cd'],txt:'每組射出左右交替彎曲的兩支箭，射向最近的敵人。'},
  firebolt:{name:'火焰彈',type:'magic',icon:'🔥',cd:2.4,m:1.5,cnt:1,ups:['dmg','count','area','cd'],txt:'拋出火焰彈，爆炸並點燃範圍內的敵人。'},
  frostring:{name:'冰霜環',type:'magic',icon:'❄️',cd:6,m:0.5,cnt:2,ups:['dmg','count','area','dur','cd'],txt:'冰晶環繞身邊 4 秒，命中會減速。'},
  thunder:{name:'落雷',type:'magic',icon:'⚡',cd:1.9,m:1.3,cnt:1,ups:['dmg','count','area','cd'],txt:'隨機對附近的敵人降下雷擊。'},
  arrowrain:{name:'箭雨',type:'ranged',icon:'🌧️',cd:3.6,m:0.45,cnt:1,ups:['dmg','count','area','dur','cd'],txt:'標記敵群最密集處，箭雨持續落下 1.5 秒。'},
  whirl:{name:'旋風斬',type:'melee',icon:'🌀',cd:4.5,m:0.45,cnt:0,ups:['dmg','area','dur','cd'],txt:'原地旋轉 2.2 秒，持續傷害周圍敵人。'},
  sanctuary:{name:'聖域',type:'magic',icon:'✨',cd:0.7,m:0.3,cnt:0,ups:['dmg','area','cd'],txt:'腳下持續展開聖域，灼燒敵人並回復 HP。'},
  lance:{name:'穿刺槍',type:'melee',icon:'🔱',cd:1.7,m:1.2,cnt:1,ups:['dmg','count','area','cd'],txt:'朝最近的敵人擲出可無限穿透的長槍。'},

function genItem(slot,ilvl,rar,kind){
  const tier=clamp(Math.floor(ilvl/8),0,4);const R=RARITY[rar];
  const it={uid:uid(),slot,ilvl,rar,refine:0,atk:0,matk:0,def:0,aff:[],new:true};
  if(slot==='weapon'){
    it.kind=kind||pick(['sword','bow','staff']);
    const v=Math.round((12+ilvl*3.5)*R.m*rnd(.9,1.1));
    if(it.kind==='staff')it.matk=v;else it.atk=v;
  }else if(slot==='head')it.def=Math.round((2+ilvl*0.4)*R.m);
  else if(slot==='armor')it.def=Math.round((3+ilvl*0.7)*R.m);
  else if(slot==='shoes')it.def=Math.round((1+ilvl*0.35)*R.m);
  const n=R.aff+(slot==='acc'?1:0);const keys=Object.keys(AFFIX);
  for(let i=0;i<n;i++){
    let k;do{k=pick(keys);}while(it.aff.some(a=>a.k===k));
    const [b,per]=AFFIX[k];let v=(b+ilvl*per*rnd(.7,1.2))*(rar===4?1.3:1);
    v=k==='regen'?Math.round(v*10)/10:Math.max(1,Math.round(v));
    it.aff.push({k,v});
  }
  const base=ITEM_NAMES[it.kind||slot][tier];
  it.name=(it.aff.length?AFFIX_PREFIX[it.aff[0].k]+'的 ':'')+base;
  return it;
}

function sfx(n,opt){
  if(!AU.ctx||AU.ctx.state!=='running')return;const t=AU.ctx.currentTime;const gap=SFX_GAP[n]!=null?SFX_GAP[n]:0.05;
  if(t-(AU.last[n]||-1)<gap)return;AU.last[n]=t;const f=SFXDEF[n];if(f)try{f(AU.sfx,t+0.005,opt);}catch(e){}
}

const lootMult=d=>clamp((d.count+d.dmg+d.hp+d.spd)/400,0.5,2);
function recomputeRun(){
  const S=G.S,st=G.st,lb=G.level-1;const V=id=>G.pv[id]||0;
  const oldMax=st.maxHp||0;
  st.dmg=S.dmg+V('might')/100+lb*0.02;
  st.maxHp=Math.round(S.maxHp*(1+V('heart')/100+lb*0.01));
  st.regen=S.regen+V('heart')/30;
  st.speed=S.speed*(1+V('wings')/100);
  st.cdMult=100/(100+S.cdr+V('hourglass'));
  st.pickup=S.pickup*(1+V('magnet')/100);
  st.crit=S.crit+V('clover');st.critDmg=S.critDmg;
  st.gold=S.gold+V('clover')*2/100;
  st.area=S.area*(1+V('sphere')/100);
  st.exp=S.exp+V('tome')/100;
  st.def=S.def+V('armor');st.eva=S.eva;
  st.proj=S.proj+V('dup');
  if(oldMax&&st.maxHp>oldMax)G.p.hp+=st.maxHp-oldMax;
}
function xpNeed(L){return Math.floor(5+L*3.5+L*L*0.22);}
function enemyLevel(){const [a,b]=G.stg.lv;return a+(b-a)*Math.min(1,G.t/420);}
function atkOf(type){const S=G.S;return type==='melee'?S.meleeAtk:type==='ranged'?S.rangedAtk:S.magicAtk;}
function baseDmg(id,M){const d=SK[id];return atkOf(d.type)*d.m*M.dmg*G.st.dmg*(1+(G.S.skill[id]||0)/100)*(d.basic?G.S.basic:1);}

/* ---------- 空間格 ---------- */
const CELL=64;const ck=(x,y)=>(x+20000)*40000+(y+20000);
function buildGrid(){const m=G.grid;m.clear();for(const e of G.enemies){if(e.dead)continue;const k=ck(Math.floor(e.x/CELL),Math.floor(e.y/CELL));let a=m.get(k);if(!a){a=[];m.set(k,a);}a.push(e);}}
function query(x,y,r,cb){const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=G.grid.get(ck(cx,cy));if(a)for(const e of a)if(!e.dead)cb(e);}}
function nearest(x,y,maxR){let best=null,bd=maxR*maxR;for(const e of G.enemies){if(e.dead)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e;}}return best;}
function randomNear(x,y,R,n){const arr=G.enemies.filter(e=>!e.dead&&(e.x-x)**2+(e.y-y)**2<R*R);const out=[];while(out.length<n&&arr.length)out.push(arr.splice(Math.floor(Math.random()*arr.length),1)[0]);return out;}
function densest(x,y,R){const c=G.enemies.filter(e=>!e.dead&&(e.x-x)**2+(e.y-y)**2<R*R);if(!c.length)return null;let best=c[0],bn=-1;for(let i=0;i<10;i++){const e=pick(c);let n=0;query(e.x,e.y,80,()=>n++);if(n>bn){bn=n;best=e;}}return best;}

/* ---------- 技能施放 ---------- */
function fireSkill(sk){
  const P=G.p,st=G.st,id=sk.id,M=sk.M;const D=baseDmg(id,M);
  const N=M.count+st.proj;const A=st.area*M.area;
  // 數量很多時用扇形平均分布，避免全部疊在一起
  const spread=(n,base)=>Math.min(base,Math.PI*1.6/Math.max(1,n-1));
  switch(id){
    case 'slash':{const t=nearest(P.x,P.y,200);const a=t?Math.atan2(t.y-P.y,t.x-P.x):P.face;P.aim=a;const r=80*A;
      const n=Math.min(N,12);for(let i=0;i<n;i++)slashArc(a+i*Math.PI*2/n,r,2.2,D*(N>12?N/12:1));return true;}
    case 'shot':{const t=nearest(P.x,P.y,520);if(!t)return false;const a=Math.atan2(t.y-P.y,t.x-P.x);P.aim=a;const sp=spread(N,0.13);
      for(let i=0;i<N;i++){const aa=a+(i-(N-1)/2)*sp;addProj({kind:'bolt',x:P.x,y:P.y,vx:Math.cos(aa)*560,vy:Math.sin(aa)*560,r:5,dmg:D,pierce:M.pierce,life:1.2,col:'#fff3c4',draw:'arrow'});}return true;}
    case 'orb':{const t=nearest(P.x,P.y,500);if(!t)return false;P.aim=Math.atan2(t.y-P.y,t.x-P.x);const sp=spread(N,0.5);
      for(let i=0;i<N;i++){const aa=P.aim+(i-(N-1)/2)*sp;addProj({kind:'homing',x:P.x,y:P.y,vx:Math.cos(aa)*300,vy:Math.sin(aa)*300,sp:320,r:7,dmg:D,pierce:0,life:2.5,col:'#b388ff',draw:'orb',tgt:t});}return true;}
    case 'dstrafe':{const t=nearest(P.x,P.y,480);if(!t)return false;const a=Math.atan2(t.y-P.y,t.x-P.x);
      for(let i=0;i<N;i++)for(const s of[-1,1]){const aa=a+s*(0.7+(i%3)*0.15);addProj({kind:'curve',x:P.x,y:P.y,vx:Math.cos(aa)*480,vy:Math.sin(aa)*480,turn:-s*3.2,r:5,dmg:D,pierce:M.pierce,life:1.1,col:'#c8f7c5',draw:'arrow',tgt:t,delay:i*0.06});}return true;}
    case 'firebolt':{const ts=randomNear(P.x,P.y,420,N);if(!ts.length)return false;while(ts.length<N)ts.push(pick(ts));
      ts.forEach((t,i)=>{addProj({kind:'lob',x:P.x,y:P.y,sx:P.x,sy:P.y,tx:t.x+(i>=ts.length?0:rnd(-15,15)),ty:t.y,T:0,dur:0.45+(i%6)*0.05,r:8,dmg:D,col:'#ff7043',draw:'fire',onEnd:p=>{sfx('boom');explode(p.x,p.y,58*A,p.dmg,'#ff7043',{burn:p.dmg*0.25});}});});return true;}
    case 'frostring':{for(let i=0;i<N;i++)addProj({kind:'orbit',ang:i*Math.PI*2/N,R:(85+Math.floor(i/12)*30)*A,spin:3.2,x:P.x,y:P.y,r:10*Math.sqrt(A),dmg:D,life:4*M.dur,col:'#81d4fa',draw:'ice',hcd:0.5,slow:1.5,hit:new Map()});return true;}
    case 'thunder':{const ts=randomNear(P.x,P.y,380,N);if(!ts.length)return false;const extra=N/ts.length;
      for(const t of ts){G.fx.push({type:'bolt',x:t.x,y:t.y,life:0.25,max:0.25});explode(t.x,t.y,42*A,D*Math.max(1,extra),'#fff59d',{noFx:true});}return true;}
    case 'arrowrain':{let ok=false;const alive=G.enemies.filter(e=>!e.dead);for(let z=0;z<N;z++){const t=z===0?densest(P.x,P.y,420):pick(alive);if(!t)continue;ok=true;
      G.areas.push({x:t.x,y:t.y,r:80*A,dmg:D,tick:0.2,tt:0.5,life:1.5*M.dur,col:'#a5d6a7',kind:'rain'});}return ok;}
    case 'whirl':{G.areas.push({follow:1,x:P.x,y:P.y,r:92*A,dmg:D,tick:0.25,tt:0,life:2.2*M.dur,col:'#e0e0e0',kind:'whirl',spin:0});return true;}
    case 'sanctuary':{const r=70*A;let hit=0;query(P.x,P.y,r+40,e=>{if((e.x-P.x)**2+(e.y-P.y)**2<(r+e.r)**2){hitEnemy(e,D);hit++;}});if(hit)heal(1+Math.floor(sk.lv/2));return true;}
    case 'lance':{const t=nearest(P.x,P.y,500);const a=t?Math.atan2(t.y-P.y,t.x-P.x):P.face;const sp=spread(N,0.25);
      for(let i=0;i<N;i++){const aa=a+(i-(N-1)/2)*sp;addProj({kind:'bolt',x:P.x,y:P.y,vx:Math.cos(aa)*700,vy:Math.sin(aa)*700,r:10*A,dmg:D,pierce:999,life:0.8,col:'#ffe082',draw:'lance',sc:Math.sqrt(A)});}return true;}
    case 'boomerang':{const t=nearest(P.x,P.y,450);if(!t)return false;const a=Math.atan2(t.y-P.y,t.x-P.x);const sp=spread(N,0.45);
      for(let i=0;i<N;i++){const aa=a+(i-(N-1)/2)*sp;addProj({kind:'boom',x:P.x,y:P.y,vx:Math.cos(aa)*420,vy:Math.sin(aa)*420,dist:0,range:260*Math.sqrt(A),back:false,r:12*A,dmg:D,life:4,col:'#b0bec5',draw:'boom',hcd:0.4,hit:new Map()});}return true;}
    case 'poison':{const ts=randomNear(P.x,P.y,400,N);if(!ts.length)return false;const extra=Math.max(1,N/ts.length);
      for(const t of ts)G.areas.push({x:t.x,y:t.y,r:52*A,dmg:D*extra,tick:0.5,tt:0,life:4*M.dur,col:'#9ccc65',kind:'pool'});return true;}
    case 'focus':{G.buffT=7*M.dur;banner('心神專注！',900,'#9fe8ff');return true;}
  }
  return false;
}
function addProj(p){if(G.projs.length>1500)return;p.dead=false;if(!p.hit)p.hit=new Set();G.projs.push(p);}
function slashArc(a,r,w,D){const P=G.p;G.fx.push({type:'slash',a,r,w,life:0.18,max:0.18});
  query(P.x,P.y,r+50,e=>{const dx=e.x-P.x,dy=e.y-P.y;const d=Math.hypot(dx,dy);if(d>r+e.r)return;let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<=w/2||d<e.r+10)hitEnemy(e,D,{kb:6});});}
function explode(x,y,r,D,col,o={}){if(!o.noFx)G.fx.push({type:'ring',x,y,r,col,life:0.3,max:0.3});
  query(x,y,r+50,e=>{if((e.x-x)**2+(e.y-y)**2<(r+e.r)**2)hitEnemy(e,D,o);});}
function heal(n){const P=G.p;const before=P.hp;P.hp=Math.min(G.st.maxHp,P.hp+n);if(P.hp-before>=1&&Math.random()<0.25)addText(P.x,P.y-24,'+'+Math.round(P.hp-before),'#7dff9a');}

/* ---------- 傷害 ---------- */
function hitEnemy(e,D,o={}){
  if(e.dead)return;let amt=D*rnd(0.9,1.1);let crit=false;
  if(Math.random()*100<G.st.crit){amt*=G.st.critDmg/100;crit=true;}
  amt=Math.max(1,Math.round(amt));e.hp-=amt;e.flash=0.08;sfx(crit?'crit':'hit');
  if(o.burn){e.burnT=3;e.burnD=Math.max(e.burnD||0,o.burn);}
  if(o.slow)e.slowT=Math.max(e.slowT||0,o.slow);
  if(o.kb&&!e.boss&&!e.mini){const dx=e.x-G.p.x,dy=e.y-G.p.y,d=Math.hypot(dx,dy)||1;e.kx=(dx/d)*o.kb*30;e.ky=(dy/d)*o.kb*30;}
  if(G.texts.length<90)addText(e.x+rnd(-6,6),e.y-e.r-4,amt,crit?'#ffd54f':'#fff',crit);
  if(e.hp<=0)killEnemy(e);
}
function addText(x,y,s,col,big){G.texts.push({x,y,s:String(s),col,big:!!big,life:0.7});}
function killEnemy(e){
  e.dead=true;G.kills++;const lvl=e.lvl;sfx(e.boss||e.mini?'bossdie':'kill');
  const gore=e.def.shape==='wisp'?[e.def.c1,e.def.c2]:['#8b0000','#5a0000','#b71c1c',e.def.c1];
  for(let i=0;i<(e.boss?30:e.mini?16:6);i++)if(G.parts.length<400)G.parts.push({x:e.x,y:e.y,vx:rnd(-170,170),vy:rnd(-170,170),life:rnd(.3,.65),col:pick(gore),s:rnd(2,4.5)});
  if(e.def.shape!=='wisp'){G.decals.push({x:e.x,y:e.y+e.r*.5,r:e.r*rnd(.8,1.4)*(e.boss?1.6:1),a:rnd(0,3),t:G.t});if(G.decals.length>110)G.decals.shift();}
  G.metaExp+=lvl*0.5*(e.boss?150:e.mini?40:e.elite?3:1);
  const cardChance=e.boss?0.5:e.mini?0.2:e.elite?0.02:0.0007;
  if(Math.random()<cardChance*lootMult(G.diff)){G.cardsFound.push(e.defId);banner(`獲得 ${e.def.name} 卡片！`,1500,'#ffe082');}
  const gearAt=(rar)=>{const it=genItem(pick(['weapon','head','armor','shoes','acc']),Math.round(enemyLevel())+(e.boss?2:0),rar);G.pk.push({type:'gear',x:e.x+rnd(-20,20),y:e.y+rnd(-20,20),v:0,item:it,mag:!!e.boss,cost:0});};
  if(e.boss){gearAt(Math.random()<0.3?4:3);gearAt(Math.min(3,rollRarity(lootMult(G.diff))+1));}
  else if(e.mini)gearAt(Math.min(3,rollRarity(lootMult(G.diff))+1));
  else if(e.elite&&Math.random()<0.05)gearAt(rollRarity(lootMult(G.diff)));
  if(e.boss){G.boss=null;G.won=true;dropPk('chest',e.x,e.y,0);setTimeout(()=>{if(G&&!G.over)endRun(true);},1600);banner(`擊敗 ${e.def.name}！`,1600,'#ffe082');return;}
  if(e.mini){G.minisKilled++;dropPk('chest',e.x,e.y,0);dropPk('gem',e.x+10,e.y,30);for(let i=0;i<6;i++)dropPk('coin',e.x+rnd(-30,30),e.y+rnd(-30,30),2+Math.floor(lvl/3));return;}
  dropPk('gem',e.x,e.y,e.elite?8:(lvl>=20?2:1));
  if(Math.random()<0.09)dropPk('coin',e.x+rnd(-8,8),e.y+rnd(-8,8),1+Math.floor(lvl/8));
  if(Math.random()<0.006)dropPk('meat',e.x,e.y,0);
  if(Math.random()<0.002)dropPk('magnet',e.x,e.y,0);
  if(e.elite&&Math.random()<0.12)dropPk('chest',e.x,e.y,0);
}
function dropPk(type,x,y,v){
  if(type==='gem'){const gems=G.pk.filter(p=>p.type==='gem');if(gems.length>350){const g=gems[Math.floor(Math.random()*gems.length)];g.v+=v;return;}}

}
function hurtPlayer(dmg){
  const P=G.p;if(P.inv>0||G.over)return;

    if(G.revive>0){G.revive--;P.hp=G.st.maxHp*0.5;P.inv=2;banner('不屈！重新站起',1500,'#ffe082');sfx('levelup');explode(P.x,P.y,220,atkOf(SK[CLASSES[G.c.cls].basic].type)*3,'#fff59d');}

}

function mkEnemy(id,x,y,kind){

  const e={id:++G.eid,defId:id,def,x,y,lvl,kx:0,ky:0,flash:0,slowT:0,burnT:0,burnD:0,burnTick:0,shootCd:rnd(1,2.5),dead:false,ph:Math.random()*6};
  if(kind===2){e.boss=1;e.hp=e.maxHp=3000*hs;e.r=def.size;e.spd=58;e.dmg=(6+lvl*2.2)*1.6;e.patT=2.5;e.state='walk';e.pi=0;}
  else if(kind===1){e.mini=1;e.hp=e.maxHp=900*hs;e.r=def.size;e.spd=62;e.dmg=(6+lvl*2.2)*1.3;e.patT=3;e.state='walk';e.pi=0;}
  else{e.hp=e.maxHp=def.hp*hs;e.r=def.size;e.spd=def.spd*rnd(.9,1.1);e.dmg=3+lvl*1.5;e.beh=def.beh;

// 敵人成長：依本局等級提升血量、傷害與數量（新生成的敵人才會套用）
function growth(){const g=(G.diff.grow==null?100:G.diff.grow)/100;const L=(G.level-1)*g;return {hp:Math.pow(1.08,L),dmg:1+0.035*L,cnt:Math.min(1.8,1+0.012*L)};}
function spawnTick(dt){
  const tm=G.t/60,dc=G.diff.count/100*growth().cnt;
  const alive=G.enemies.length;const maxE=Math.min(500,(24+tm*42)*dc);
  G.spawnAcc+=dt*(2+tm*2.2)*dc;
  while(G.spawnAcc>=1){G.spawnAcc--;if(alive>=maxE)continue;
    const pool=G.stg.mons.filter((m,i)=>G.t>=[0,15,60,120][i]);const [x,y]=spawnPos();
    const id=pick(pool);
    if(MON[id].beh==='swarm'&&Math.random()<0.3){for(let i=0;i<4;i++)mkEnemy(id,x+rnd(-30,30),y+rnd(-30,30),0);}else mkEnemy(id,x,y,0);}
  // 事件
  if(G.t>=G.nextEvt){G.nextEvt+=55/(G.diff.evt/100);
    const id=pick(G.stg.mons.slice(0,Math.min(4,1+Math.floor(G.t/90))));
    if(Math.random()<0.5){const n=Math.round(26*dc);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;mkEnemy(id,G.p.x+Math.cos(a)*440,G.p.y+Math.sin(a)*440,0);}banner('⚠ 包圍來襲！',1300);sfx('horde');}
    else{const a=Math.random()*Math.PI*2;const n=Math.round(18*dc);for(let i=0;i<n;i++){const e=mkEnemy(id,G.p.x+Math.cos(a)*520+rnd(-90,90),G.p.y+Math.sin(a)*520+rnd(-90,90),0);e.rush={x:-Math.cos(a),y:-Math.sin(a)};e.spd*=1.8;}banner('⚠ 獸群衝鋒！',1300);sfx('horde');}
  }
  // 頭目
  if(G.miniIdx<MINI_T.length&&G.t>=MINI_T[G.miniIdx]){const id=G.stg.minis[G.miniIdx];G.miniIdx++;const [x,y]=spawnPos();const e=mkEnemy(id,x,y,1);G.minisAlive.push(e);banner(`⚠ ${MON[id].name} 出現了！`,2000);sfx('warning');}
  if(!G.bossOut&&G.t>=RUN_LEN){G.bossOut=true;const [x,y]=spawnPos();G.boss=mkEnemy(G.stg.boss,x,y,2);banner(`⚠ 頭目 ${MON[G.stg.boss].name} 降臨！`,2600);sfx('warning');playMusic('boss');}
}
function updateEnemies(dt){
  const P=G.p,sm=G.diff.spd/100;
  for(const e of G.enemies){
    if(e.dead)continue;
    if(e.flash>0)e.flash-=dt;
    if(e.slowT>0)e.slowT-=dt;
    if(e.burnT>0){e.burnT-=dt;e.burnTick-=dt;if(e.burnTick<=0){e.burnTick=0.5;hitEnemy(e,e.burnD*0.5);if(e.dead)continue;}}
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    let sp=e.spd*sm*(e.slowT>0?0.55:1);let mx=dx/d,my=dy/d;
    if(e.boss||e.mini){bossAI(e,dt,dx,dy,d);}
    else{
      if(e.rush){mx=e.rush.x;my=e.rush.y;e.rushT=(e.rushT||0)+dt;if(e.rushT>5){e.rush=null;e.spd/=1.8;}}
      else if(e.beh==='ranged'){if(d<170){mx=-mx;my=-my;}else if(d<240){mx=my=0;}
        e.shootCd-=dt;if(e.shootCd<=0&&d<460){e.shootCd=2.8;ebullet(e.x,e.y,Math.atan2(dy,dx),190,e.dmg*0.9,e.def.c1);}}
      else if(e.beh==='swarm'){const w=Math.sin(G.t*3+e.ph)*0.7;const nx=mx*Math.cos(w)-my*Math.sin(w),ny=mx*Math.sin(w)+my*Math.cos(w);mx=nx;my=ny;}
      e.x+=mx*sp*dt+e.kx*dt;e.y+=my*sp*dt+e.ky*dt;e.kx*=0.85;e.ky*=0.85;
      if(d>Math.max(1300,Math.hypot(VW,VH)/G.zoom*0.8)){const [x,y]=spawnPos();e.x=x;e.y=y;}
    }
    e.face=dx<0?-1:1;
    if(d<e.r+P.r)hurtPlayer(e.dmg);
  }
  // 分離
  for(const e of G.enemies){if(e.dead||e.boss)continue;let px=0,py=0;
    query(e.x,e.y,e.r+20,o=>{if(o===e)return;const dx=e.x-o.x,dy=e.y-o.y,d2=dx*dx+dy*dy,rr=e.r+o.r;if(d2<rr*rr&&d2>0.01){const d=Math.sqrt(d2);const f=(rr-d)/rr;px+=dx/d*f;py+=dy/d*f;}});
    e.x+=px*60*dt*2;e.y+=py*60*dt*2;}
  G.enemies=G.enemies.filter(e=>!e.dead);
  G.minisAlive=G.minisAlive.filter(e=>!e.dead);
}
function ebullet(x,y,a,sp,dmg,col){G.eb.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:6,dmg,life:4,col});}
function bossAI(e,dt,dx,dy,d){
  const P=G.p,sm=G.diff.spd/100;
  if(e.state==='walk'){e.x+=dx/d*e.spd*sm*dt;e.y+=dy/d*e.spd*sm*dt;e.patT-=dt;
    if(e.patT<=0){const pat=e.def.pat[e.pi%e.def.pat.length];e.pi++;startPattern(e,pat,dx,dy,d);}}
  else if(e.state==='wind'){e.wt-=dt;if(e.wt<=0){e.state='dash';e.dt=0.55;}}
  else if(e.state==='dash'){e.x+=e.dvx*dt;e.y+=e.dvy*dt;e.dt-=dt;if(e.dt<=0){e.state='walk';e.patT=e.boss?2.2:3.2;}}
  else if(e.state==='cast'){e.ct-=dt;if(e.ct<=0){e.state='walk';e.patT=e.boss?2.2:3.2;}}
}
function startPattern(e,pat,dx,dy,d){
  const a=Math.atan2(dy,dx);const P=G.p;
  if(pat==='charge'){e.state='wind';e.wt=0.8;const sp=620;e.dvx=Math.cos(a)*sp;e.dvy=Math.sin(a)*sp;G.teles.push({type:'line',x:e.x,y:e.y,a,len:sp*0.55,w:e.r*1.6,t:0,dur:0.8,follow:e});}
  else if(pat==='nova'){e.state='cast';e.ct=1.2;const n=e.boss?18:12;for(let w=0;w<2;w++)setTimeout(()=>{if(!G||e.dead||G.over)return;for(let i=0;i<n;i++)ebullet(e.x,e.y,i/n*Math.PI*2+w*0.17,170,e.dmg*0.7,e.def.c1);},w*450);}
  else if(pat==='spray'){e.state='cast';e.ct=1.0;for(let w=0;w<3;w++)setTimeout(()=>{if(!G||e.dead||G.over)return;const aa=Math.atan2(G.p.y-e.y,G.p.x-e.x);for(let i=-2;i<=2;i++)ebullet(e.x,e.y,aa+i*0.18,230,e.dmg*0.7,e.def.c2);},w*260);}
  else if(pat==='slam'){e.state='cast';e.ct=1.1;const n=e.boss?3:1;for(let i=0;i<n;i++){const x=P.x+(i?rnd(-120,120):0),y=P.y+(i?rnd(-120,120):0);G.teles.push({type:'circle',x,y,r:95,t:0,dur:1.0,dmg:e.dmg*1.6,col:e.def.c1});}}
  else if(pat==='summon'){e.state='cast';e.ct=0.8;const n=e.boss?10:6;for(let i=0;i<n;i++){const aa=i/n*Math.PI*2;mkEnemy(pick(G.stg.mons),e.x+Math.cos(aa)*70,e.y+Math.sin(aa)*70,0);}G.fx.push({type:'ring',x:e.x,y:e.y,r:90,col:'#ce93d8',life:0.4,max:0.4});}
}

/* ---------- 更新 ---------- */
function update(dt){
  G.t+=dt;const P=G.p,st=G.st;
  buildGrid();
  // 移動
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my--;if(keys['s']||keys['arrowdown'])my++;if(keys['a']||keys['arrowleft'])mx--;if(keys['d']||keys['arrowright'])mx++;
  if(joy){const jx=joy.x-joy.ox,jy=joy.y-joy.oy,jl=Math.hypot(jx,jy);if(jl>8){mx=jx/jl;my=jy/jl;}}
  const ml=Math.hypot(mx,my);P.moving=ml>0;
  if(ml){mx/=ml;my/=ml;P.face=Math.atan2(my,mx);const sp=150*st.speed*(G.buffT>0?1.25:1);P.x+=mx*sp*dt;P.y+=my*sp*dt;}
  P.hp=Math.min(st.maxHp,P.hp+st.regen*dt);if(P.inv>0)P.inv-=dt;
  if(G.buffT>0)G.buffT-=dt;
  // 技能
  const cdm=st.cdMult*(G.buffT>0?0.77:1);
  for(const sk of G.skills){sk.cd-=dt;if(sk.cd<=0){const ok=fireSkill(sk);if(ok)sfx('sk_'+sk.id);const full=Math.max(0.08,SK[sk.id].cd*sk.M.cd*cdm);sk.cd=ok?full:0.15;sk.max=full;}}
  spawnTick(dt);
  updateEnemies(dt);
  buildGrid();
  updateProjs(dt);
  updateAreas(dt);
  // 敵方子彈
  for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if((b.x-P.x)**2+(b.y-P.y)**2<(b.r+P.r)**2){hurtPlayer(b.dmg);b.life=0;}}
  G.eb=G.eb.filter(b=>b.life>0);
  // 預警
  for(const t of G.teles){t.t+=dt;if(t.follow&&!t.follow.dead){t.x=t.follow.x;t.y=t.follow.y;}
    if(t.type==='circle'&&t.t>=t.dur){if((P.x-t.x)**2+(P.y-t.y)**2<t.r*t.r)hurtPlayer(t.dmg);G.fx.push({type:'ring',x:t.x,y:t.y,r:t.r,col:t.col,life:0.3,max:0.3});}}
  G.teles=G.teles.filter(t=>t.t<t.dur);
  // 掉落物
  updatePickups(dt);
  // 地圖寶箱
  if(G.t>=G.nextChest){G.nextChest+=60;const old=G.pk.filter(p=>p.type==='chest'&&p.map);if(old.length>=2)old[0].dead=true;const a=Math.random()*Math.PI*2;G.pk.push({type:'chest',x:P.x+Math.cos(a)*rnd(320,480),y:P.y+Math.sin(a)*rnd(320,480),v:0,cost:G.chestCost,map:true});}
  // 特效
  for(const f of G.fx)f.life-=dt;G.fx=G.fx.filter(f=>f.life>0);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.9;p.vy*=0.9;p.life-=dt;}G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y-=30*dt;t.life-=dt;}G.texts=G.texts.filter(t=>t.life>0);
  if(G.needMsgT>0)G.needMsgT-=dt;
  if(G.pendingLv>0&&!G.modal)openLevelUp();
}
function updateProjs(dt){
  const P=G.p;
  for(const p of G.projs){
    if(p.delay>0){p.delay-=dt;p.x=P.x;p.y=P.y;continue;}
    p.life-=dt;if(p.life<=0){p.dead=true;continue;}
    switch(p.kind){
      case 'bolt':p.x+=p.vx*dt;p.y+=p.vy*dt;break;
      case 'curve':{const c=Math.cos(p.turn*dt),s=Math.sin(p.turn*dt);const vx=p.vx*c-p.vy*s,vy=p.vx*s+p.vy*c;p.vx=vx;p.vy=vy;p.turn*=Math.pow(0.08,dt);
        if(p.tgt&&!p.tgt.dead&&p.life<0.9){const a=Math.atan2(p.tgt.y-p.y,p.tgt.x-p.x),sp=Math.hypot(p.vx,p.vy);p.vx+=(Math.cos(a)*sp-p.vx)*6*dt;p.vy+=(Math.sin(a)*sp-p.vy)*6*dt;}
        p.x+=p.vx*dt;p.y+=p.vy*dt;break;}
      case 'homing':{if(!p.tgt||p.tgt.dead)p.tgt=nearest(p.x,p.y,400);if(p.tgt){const a=Math.atan2(p.tgt.y-p.y,p.tgt.x-p.x);p.vx+=(Math.cos(a)*p.sp-p.vx)*5*dt;p.vy+=(Math.sin(a)*p.sp-p.vy)*5*dt;}p.x+=p.vx*dt;p.y+=p.vy*dt;break;}
      case 'orbit':p.ang+=p.spin*dt;p.x=P.x+Math.cos(p.ang)*p.R;p.y=P.y+Math.sin(p.ang)*p.R;break;
      case 'boom':{if(!p.back){p.x+=p.vx*dt;p.y+=p.vy*dt;p.dist+=Math.hypot(p.vx,p.vy)*dt;if(p.dist>=p.range)p.back=true;}
        else{const a=Math.atan2(P.y-p.y,P.x-p.x);p.x+=Math.cos(a)*480*dt;p.y+=Math.sin(a)*480*dt;if((P.x-p.x)**2+(P.y-p.y)**2<400){p.dead=true;continue;}}p.rot=(p.rot||0)+dt*18;break;}
      case 'lob':{p.T+=dt;const k=Math.min(1,p.T/p.dur);p.x=p.sx+(p.tx-p.sx)*k;p.y=p.sy+(p.ty-p.sy)*k;p.h=Math.sin(k*Math.PI)*60;if(k>=1){p.dead=true;p.onEnd(p);}continue;}
    }
    query(p.x,p.y,p.r+60,e=>{
      if(p.dead||e.dead)return;if((e.x-p.x)**2+(e.y-p.y)**2>(e.r+p.r)**2)return;
      if(p.hit instanceof Map){const nt=p.hit.get(e.id)||0;if(G.t<nt)return;p.hit.set(e.id,G.t+p.hcd);hitEnemy(e,p.dmg,{slow:p.slow,kb:2});}
      else{if(p.hit.has(e.id))return;p.hit.add(e.id);hitEnemy(e,p.dmg,{kb:3});if(p.pierce--<=0)p.dead=true;}
    });
  }
  G.projs=G.projs.filter(p=>!p.dead);
}
function updateAreas(dt){
  const P=G.p;
  for(const a of G.areas){
    a.life-=dt;if(a.follow){a.x=P.x;a.y=P.y;a.spin+=dt*14;}
    a.tt-=dt;if(a.tt<=0&&a.life>0){a.tt=a.tick;query(a.x,a.y,a.r+50,e=>{if((e.x-a.x)**2+(e.y-a.y)**2<(a.r+e.r)**2)hitEnemy(e,a.dmg,{slow:a.kind==='pool'?0.6:0});});}
  }
  G.areas=G.areas.filter(a=>a.life>0);
}
function updatePickups(dt){
  const P=G.p,R=G.st.pickup;
  for(const p of G.pk){
    const dx=P.x-p.x,dy=P.y-p.y,d=Math.hypot(dx,dy)||1;
    if(p.type==='chest'){if(p.mag&&!p.map){p.x+=dx/d*600*dt;p.y+=dy/d*600*dt;}
      if(d<P.r+18){
        if(!p.map||G.gold>=p.cost){if(p.map){G.gold-=p.cost;G.chestCost=Math.round(G.chestCost*1.6);for(const q of G.pk)if(q.type==='chest'&&q.map)q.cost=G.chestCost;}p.dead=true;openChest(p.map?1:(G.won?3:rint(1,3)));}
        else if(G.needMsgT<=0){G.needMsgT=1.2;addText(p.x,p.y-26,`需要 ${p.cost} 金幣`,'#ffd54f');}}
      continue;}
    if(p.mag||d<R){p.mag=true;const sp=420+(G.t%1)*10;p.x+=dx/d*sp*dt*1.4;p.y+=dy/d*sp*dt*1.4;}
    if(d<P.r+8){p.dead=true;
      if(p.type==='gem'){gainXp(p.v);sfx('gem');}
      else if(p.type==='coin'){G.gold+=Math.max(1,Math.round(p.v*G.st.gold));sfx('coin');}
      else if(p.type==='meat'){heal(Math.round(G.st.maxHp*0.3));sfx('heal');addText(P.x,P.y-30,'回復！','#7dff9a',true);}
      else if(p.type==='gear'){G.gearFound.push(p.item);sfx('gear');addText(P.x,P.y-34,'獲得 '+p.item.name,RAR_COL[p.item.rar],true);}
      else if(p.type==='magnet'){sfx('magnet');for(const q of G.pk)if(!(q.type==='chest'&&q.map))q.mag=true;addText(P.x,P.y-30,'全部吸取！','#9fe8ff',true);}
    }
  }
  G.pk=G.pk.filter(p=>!p.dead);
}
function gainXp(v){G.xp+=v*G.st.exp;while(G.xp>=xpNeed(G.level+G.pendingLv)){G.xp-=xpNeed(G.level+G.pendingLv);G.pendingLv++;}}

/* ---------- 升級選項 ---------- */
function ownedSkill(id){return G.skills.find(s=>s.id===id);}
function rollChoices(n=3){
  const opts=[];const aff=CLASSES[G.c.cls].aff;
  const pasRoll=id=>{const [a,b]=PS[id].r;const v=rint(a,b);return {v,tier:tierOf(v,a,b)};};
  for(const s of G.skills)opts.push({kind:'skill',id:s.id,lv:s.lv+1,up:rollUpg(SK[s.id].ups),w:3});
  for(const id in G.passives)opts.push({kind:'pas',id,lv:G.passives[id]+1,...pasRoll(id),w:2});
  if(G.skills.length<5)for(const id of POOL)if(!ownedSkill(id))opts.push({kind:'skill',id,lv:1,w:aff.includes(id)?2.5:0.8});
  if(Object.keys(G.passives).length<4)for(const id in PS)if(!G.passives[id])opts.push({kind:'pas',id,lv:1,...pasRoll(id),w:1.3});
  const out=[];while(out.length<n&&opts.length){const o=wpick(opts);out.push(o);opts.splice(opts.indexOf(o),1);}
  if(!out.length){out.push({kind:'gold'},{kind:'heal'});}
  return out;
}
function applyChoice(o){
  if(o.kind==='skill'){const s=ownedSkill(o.id);if(s){s.lv++;applyUp(s.M,o.up);}else G.skills.push(newSkill(o.id));}
  else if(o.kind==='pas'){G.passives[o.id]=(G.passives[o.id]||0)+1;G.pv[o.id]=(G.pv[o.id]||0)+o.v;recomputeRun();}
  else if(o.kind==='gold')G.gold+=50;
  else if(o.kind==='heal')heal(Math.round(G.st.maxHp*0.3));
  buildSkillHud();
}
function choiceHtml(o,i){
  if(o.kind==='gold')return `<div class="choice" data-i="${i}"><span class="tag">獎勵</span><div class="ic">🪙</div><b>金幣袋</b><p>獲得 50 金幣</p><span class="num">${i+1}</span></div>`;
  if(o.kind==='heal')return `<div class="choice" data-i="${i}"><span class="tag">獎勵</span><div class="ic">🍖</div><b>烤肉</b><p>回復 30% HP</p><span class="num">${i+1}</span></div>`;
  const d=o.kind==='skill'?SK[o.id]:PS[o.id];
  const tag=o.kind==='skill'?(d.basic?'普攻':'技能')+' · '+TYPE_NAME[d.type]:'被動';
  let main,sub;
  const roll=(txt,t)=>`<div style="font-size:19px;font-weight:800;color:${RTIER[t][1]};margin-top:6px">${txt}</div><div style="font-size:12px;color:${RTIER[t][1]}">${RTIER[t][0]}</div>`;
  if(o.kind==='skill'){
    if(o.up){const s=ownedSkill(o.id);const M2={...s.M};applyUp(M2,o.up);main=roll(UPG[o.up.k].fmt(o.up.v),o.up.tier);sub=`升級後：${skillStat(o.id,M2)}`;}
    else{main='';sub=`${d.txt}<br>${skillStat(o.id,newSkill(o.id).M)}`;}
  }else{main=roll(d.fmt(o.v),o.tier);sub=G.pv[o.id]?`目前累計：${d.fmt(G.pv[o.id])}`:'';}
  return `<div class="choice" data-i="${i}"><span class="tag">${tag}</span>${o.lv===1?'<span class="new">新！</span>':''}<div class="ic">${d.icon}</div><b>${d.name} ${o.lv===1?'':'Lv '+o.lv}</b>${main}<p>${sub}</p><span class="num">${i+1}</span></div>`;
}
function ownRow(){
  const sk=G.skills.map(s=>`<div class="sk" title="${SK[s.id].name}">${SK[s.id].icon}<span class="lv">${s.lv}</span></div>`).join('')+'<div class="sk empty"></div>'.repeat(5-G.skills.length);
  const ps=Object.keys(G.passives).map(id=>`<div class="sk" title="${PS[id].name}">${PS[id].icon}<span class="lv">${G.passives[id]}</span></div>`).join('')+'<div class="sk empty"></div>'.repeat(4-Object.keys(G.passives).length);
  return `<div class="ownrow"><span class="mute" style="color:#cfe0ff;align-self:center">技能 ${G.skills.length-1}/4</span>${sk}</div><div class="ownrow slots small" style="margin-top:5px"><span class="mute" style="color:#cfe0ff;align-self:center">被動 ${Object.keys(G.passives).length}/4</span>${ps}</div>`;
}
function openLevelUp(){
  G.modal='lv';G.pendingLv--;G.level++;recomputeRun();sfx('levelup');
  const opts=rollChoices();
  const M=$('#modal');M.classList.remove('hidden');
  const render=()=>{
    M.innerHTML=`<div class="lvup"><h2>升級！ Lv ${G.level}</h2><div class="pill" style="background:#ffffff22;color:#fff">傷害 +2% · 最大 HP +1%</div><div style="margin-top:10px">${ownRow()}</div>
    <div class="choices">${opts.map(choiceHtml).join('')}</div>
    <div class="row" style="justify-content:center"><button id="reroll" class="ghost" ${G.rerolls>0?'':'disabled'}>🎲 重抽（R）剩 ${G.rerolls}</button></div><p class="mute" style="color:#cfe0ff">按 1–3 或點擊卡片選擇</p></div>`;

const MM_RANGE=[1100,2600];let mmIdx=0;
function toggleMinimap(){mmIdx=(mmIdx+1)%MM_RANGE.length;}
$('#mm').onclick=toggleMinimap;
const mmc=$('#mm').getContext('2d');
function drawMinimap(){
  const S=300,R=MM_RANGE[mmIdx],k=(S/2-8)/R,P=G.p,g=mmc;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,S,S);
  g.save();g.beginPath();g.arc(S/2,S/2,S/2,0,7);g.clip();
  g.fillStyle='rgba(18,12,12,.88)';g.fillRect(0,0,S,S);
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=2;for(const r of[.33,.66]){g.beginPath();g.arc(S/2,S/2,S/2*r,0,7);g.stroke();}
  const vw=VW/G.zoom*k,vh=VH/G.zoom*k;g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=2;g.strokeRect(S/2-vw/2,S/2-vh/2,vw,vh);
  const pos=(x,y)=>[S/2+(x-P.x)*k,S/2+(y-P.y)*k];
  const edge=(x,y)=>{let [sx,sy]=pos(x,y);const dx=sx-S/2,dy=sy-S/2,d=Math.hypot(dx,dy),max=S/2-13;if(d>max){return [S/2+dx/d*max,S/2+dy/d*max,true];}return [sx,sy,false];};
  // 一般敵人（紅點）、菁英（較大）
  let n=0;for(const e of G.enemies){if(e.dead||e.boss||e.mini)continue;const [sx,sy]=pos(e.x,e.y);if(sx<0||sy<0||sx>S||sy>S)continue;
    g.fillStyle=e.elite?'#ffca28':'rgba(229,57,53,.8)';const s=e.elite?7:4;g.fillRect(sx-s/2,sy-s/2,s,s);if(++n>600)break;}
  // 補給：烤肉、磁鐵
  for(const p of G.pk){if(p.type!=='meat'&&p.type!=='magnet')continue;const [sx,sy,out]=edge(p.x,p.y);if(out)continue;
    g.fillStyle=p.type==='meat'?'#81c784':'#4fc3f7';g.beginPath();g.arc(sx,sy,5,0,7);g.fill();}
  // 寶箱、裝備（超出範圍時貼在邊緣）
  for(const p of G.pk){
    if(p.type==='chest'){const [sx,sy]=edge(p.x,p.y);g.fillStyle=p.map?(G.gold>=p.cost?'#ffd54f':'#8d6e63'):'#ffd54f';g.strokeStyle='#000';g.lineWidth=2;g.fillRect(sx-8,sy-6,16,12);g.strokeRect(sx-8,sy-6,16,12);g.fillStyle='#000';g.fillRect(sx-1.5,sy-4,3,5);}
    else if(p.type==='gear'){const [sx,sy]=edge(p.x,p.y);g.fillStyle=RAR_COL[p.item.rar];g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.moveTo(sx,sy-9);g.lineTo(sx+8,sy);g.lineTo(sx,sy+9);g.lineTo(sx-8,sy);g.closePath();g.fill();g.stroke();}
  }
  // 頭目
  for(const B of[G.boss,...G.minisAlive]){if(!B||B.dead)continue;const [sx,sy]=edge(B.x,B.y);const pu=1+Math.sin(G.t*6)*.15;
    g.fillStyle=B.boss?'#ff1744':'#ff9100';g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.arc(sx,sy,(B.boss?13:10)*pu,0,7);g.fill();g.stroke();
    g.fillStyle='#000';g.font='bold 14px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(B.boss?'王':'菁',sx,sy+1);}
  // 玩家
  g.save();g.translate(S/2,S/2);g.rotate(P.face);g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.moveTo(11,0);g.lineTo(-7,-8);g.lineTo(-3,0);g.lineTo(-7,8);g.closePath();g.fill();g.stroke();g.restore();
  g.restore();
  g.fillStyle='rgba(255,255,255,.45)';g.font='17px sans-serif';g.textAlign='center';g.textBaseline='alphabetic';g.fillText(mmIdx?'廣域':'近距',S/2,S-16);
}

/* ---------- 繪製 ---------- */
function render(){
  const P=G.p;const z=G.zoom,WW=VW/z,WH=VH/z;ctx.setTransform(DPR*z,0,0,DPR*z,0,0);
  const cx=P.x-WW/2,cy=P.y-WH/2;
  drawGround(G.stg,cx,cy,WW,WH);
  ctx.save();ctx.translate(-cx,-cy);
  const vis=(x,y,m)=>x>cx-m&&x<cx+WW+m&&y>cy-m&&y<cy+WH+m;
  // 血跡（慢慢淡去）
  for(const d of G.decals){const age=G.t-d.t;if(age>20||!vis(d.x,d.y,40))continue;ctx.globalAlpha=Math.min(.5,(20-age)/20*.5);ctx.fillStyle='#4a0000';ctx.beginPath();ctx.ellipse(d.x,d.y,d.r,d.r*.55,d.a,0,7);ctx.ellipse(d.x+d.r*.6,d.y+d.r*.25,d.r*.45,d.r*.3,d.a,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  // 聖域
  const sanc=ownedSkill('sanctuary');if(sanc){const r=70*G.st.area*sanc.M.area;ctx.fillStyle='rgba(255,241,170,.12)';ctx.strokeStyle='rgba(255,241,170,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,r,0,7);ctx.fill();ctx.stroke();}
  // 區域
  for(const a of G.areas){
    if(a.kind==='pool'){ctx.fillStyle='rgba(124,179,66,.35)';ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.fill();ctx.fillStyle='rgba(200,255,150,.5)';for(let i=0;i<4;i++){const b=(G.t*2+i*1.7)%1;ctx.beginPath();ctx.arc(a.x+Math.cos(i*2.1)*a.r*.5,a.y+Math.sin(i*2.1)*a.r*.5-b*10,3*(1-b)+1,0,7);ctx.fill();}}
    else if(a.kind==='rain'){ctx.strokeStyle='rgba(165,214,167,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.stroke();ctx.strokeStyle='#e8f5e9';for(let i=0;i<10;i++){const rx=a.x+rnd(-a.r,a.r)*.8,ry=a.y+rnd(-a.r,a.r)*.8;ctx.beginPath();ctx.moveTo(rx-4,ry-16);ctx.lineTo(rx,ry);ctx.stroke();}}
    else if(a.kind==='whirl'){ctx.strokeStyle='rgba(230,230,230,.75)';ctx.lineWidth=5;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(a.x,a.y,a.r*(.6+i*.18),a.spin+i*2,a.spin+i*2+1.6);ctx.stroke();}}
  }
  // 預警
  for(const t of G.teles){const k=t.t/t.dur;
    if(t.type==='circle'){ctx.fillStyle=`rgba(255,60,40,${0.12+k*0.2})`;ctx.strokeStyle='rgba(255,80,60,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(t.x,t.y,t.r*k,0,7);ctx.fill();}
    else{ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.a);ctx.fillStyle=`rgba(255,60,40,${0.15+k*0.25})`;ctx.fillRect(0,-t.w/2,t.len,t.w);ctx.restore();}}
  // 掉落物
  for(const p of G.pk){if(!vis(p.x,p.y,30))continue;
    if(p.type==='gem'){const col=p.v>=20?'#ff5252':p.v>=5?'#69f0ae':'#64b5f6';ctx.fillStyle=col;ctx.beginPath();const s=p.v>=20?8:p.v>=5?6:5;ctx.moveTo(p.x,p.y-s);ctx.lineTo(p.x+s*.7,p.y);ctx.lineTo(p.x,p.y+s);ctx.lineTo(p.x-s*.7,p.y);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(p.x-1,p.y-s*.5,2,s*.5);}
    else if(p.type==='coin'){ctx.fillStyle='#ffd54f';ctx.strokeStyle='#b8860b';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();ctx.stroke();}
    else if(p.type==='meat'){ctx.fillStyle='#a1887f';ctx.beginPath();ctx.ellipse(p.x,p.y,9,7,0.4,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(p.x+5,p.y+3,6,3);}
    else if(p.type==='magnet'){ctx.strokeStyle='#e53935';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,8,Math.PI,0);ctx.stroke();ctx.fillStyle='#eee';ctx.fillRect(p.x-10.5,p.y,5,5);ctx.fillRect(p.x+5.5,p.y,5,5);}
    else if(p.type==='gear'){const col=RAR_COL[p.item.rar];const b=Math.sin(G.t*3+p.x)*2;
      ctx.globalAlpha=.22+.1*Math.sin(G.t*4);ctx.fillStyle=col;ctx.fillRect(p.x-6,p.y-70,12,70);ctx.beginPath();ctx.arc(p.x,p.y,18,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#3a2a1e';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(p.x-11,p.y-8+b,22,15,3);ctx.fill();ctx.stroke();ctx.fillStyle=col;ctx.fillRect(p.x-4,p.y-12+b,8,4);ctx.fillRect(p.x-2,p.y-3+b,4,4);}
    else if(p.type==='chest'){const b=Math.sin(G.t*4)*2;ctx.fillStyle='#8d5524';ctx.fillRect(p.x-14,p.y-8+b,28,18);ctx.fillStyle='#c68642';ctx.fillRect(p.x-14,p.y-14+b,28,8);ctx.fillStyle='#ffd54f';ctx.fillRect(p.x-3,p.y-8+b,6,7);
      if(p.map){ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillStyle=G.gold>=p.cost?'#ffd54f':'#ff8a80';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(p.cost+' 金',p.x,p.y-20+b);ctx.fillText(p.cost+' 金',p.x,p.y-20+b);}}
  }
  // 敵人
  const es=G.enemies.filter(e=>vis(e.x,e.y,80)).sort((a,b)=>a.y-b.y);
  for(const e of es){
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.95,e.r*.85,e.r*.28,0,0,7);ctx.fill();
    ctx.save();ctx.translate(e.x,e.y);if(e.face<0)ctx.scale(-1,1);
    if(e.elite){ctx.fillStyle='rgba(255,215,64,.25)';ctx.beginPath();ctx.arc(0,0,e.r*1.4,0,7);ctx.fill();}
    if(e.state==='wind'){ctx.translate(rnd(-2,2),rnd(-2,2));}
    drawMon(ctx,e.def,e.r,G.t+e.ph,e.flash>0);
    ctx.restore();
    if(e.burnT>0){ctx.fillStyle='rgba(255,112,67,.8)';ctx.beginPath();ctx.arc(e.x+rnd(-e.r,e.r)*.5,e.y-e.r*.3+rnd(-4,4),2.5,0,7);ctx.fill();}
    if(e.slowT>0){ctx.strokeStyle='rgba(129,212,250,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,7);ctx.stroke();}
    if((e.elite||e.mini)&&e.hp<e.maxHp&&!e.boss){ctx.fillStyle='#000a';ctx.fillRect(e.x-e.r,e.y-e.r-12,e.r*2,4);ctx.fillStyle='#ff5252';ctx.fillRect(e.x-e.r,e.y-e.r-12,e.r*2*e.hp/e.maxHp,4);}
  }
  // 玩家
  ctx.save();ctx.translate(P.x,P.y);if(P.inv>0&&Math.floor(G.t*20)%2)ctx.globalAlpha=0.5;
  if(G.buffT>0){ctx.strokeStyle='rgba(159,232,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,22+Math.sin(G.t*8)*2,0,7);ctx.stroke();}
  const flip=Math.cos(P.aim)<0;if(flip)ctx.scale(-1,1);drawHero(ctx,G.c.cls,13,G.t,P.moving,flip?Math.PI-P.aim:P.aim);ctx.restore();
  ctx.fillStyle='#000a';ctx.fillRect(P.x-16,P.y+18,32,4);ctx.fillStyle='#4cd964';ctx.fillRect(P.x-16,P.y+18,32*P.hp/G.st.maxHp,4);
  // 投射物
  for(const p of G.projs){if(p.delay>0||!vis(p.x,p.y,40))continue;
    ctx.save();ctx.translate(p.x,p.y);
    switch(p.draw){
      case 'arrow':ctx.rotate(Math.atan2(p.vy,p.vx));ctx.strokeStyle=p.col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(6,0);ctx.stroke();ctx.fillStyle=p.col;ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(3,-4);ctx.lineTo(3,4);ctx.fill();break;
      case 'orb':ctx.fillStyle='rgba(179,136,255,.35)';ctx.beginPath();ctx.arc(0,0,p.r*1.8,0,7);ctx.fill();ctx.fillStyle='#e1d0ff';ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();break;
      case 'fire':ctx.translate(0,-(p.h||0));ctx.fillStyle='rgba(255,152,0,.4)';ctx.beginPath();ctx.arc(0,0,p.r*1.8,0,7);ctx.fill();ctx.fillStyle='#ffca28';ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();break;
      case 'ice':ctx.rotate(p.ang+Math.PI/2);ctx.fillStyle='#b3e5fc';ctx.strokeStyle='#4fc3f7';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-p.r);ctx.lineTo(p.r*.55,0);ctx.lineTo(0,p.r);ctx.lineTo(-p.r*.55,0);ctx.closePath();ctx.fill();ctx.stroke();break;
      case 'lance':ctx.rotate(Math.atan2(p.vy,p.vx));ctx.fillStyle=p.col;ctx.fillRect(-26,-2.5,40,5);ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(12,-7);ctx.lineTo(12,7);ctx.fill();break;
      case 'boom':ctx.rotate(p.rot||0);ctx.fillStyle='#cfd8dc';ctx.strokeStyle='#546e7a';ctx.lineWidth=1.5;for(let i=0;i<3;i++){ctx.rotate(Math.PI*2/3);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(p.r*.6,-p.r*.4,p.r,-p.r*.1);ctx.lineTo(p.r*.3,p.r*.2);ctx.closePath();ctx.fill();ctx.stroke();}break;
    }
    ctx.restore();}
  for(const b of G.eb){if(!vis(b.x,b.y,20))continue;ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
  // 特效
  for(const f of G.fx){const k=f.life/f.max;
    if(f.type==='slash'){ctx.strokeStyle=`rgba(255,255,255,${k})`;ctx.lineWidth=6*k+2;ctx.beginPath();ctx.arc(P.x,P.y,f.r*(1-k*.25),f.a-f.w/2,f.a+f.w/2);ctx.stroke();}
    else if(f.type==='ring'){ctx.strokeStyle=f.col;ctx.globalAlpha=k;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.1-k*.4),0,7);ctx.stroke();ctx.fillStyle=f.col;ctx.globalAlpha=k*.25;ctx.fill();ctx.globalAlpha=1;}
    else if(f.type==='bolt'){ctx.strokeStyle=`rgba(255,250,200,${k})`;ctx.lineWidth=3;ctx.beginPath();let x=f.x+rnd(-10,10),y=f.y-260;ctx.moveTo(x,y);while(y<f.y){y+=26;x+=rnd(-14,14);ctx.lineTo(x,Math.min(y,f.y));}ctx.stroke();ctx.fillStyle=`rgba(255,250,200,${k*.4})`;ctx.beginPath();ctx.arc(f.x,f.y,30,0,7);ctx.fill();}
  }
  for(const p of G.parts){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}ctx.globalAlpha=1;
  ctx.restore();
  // 黑暗、手電筒光圈、低血量紅暈（螢幕座標）
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const hpR=P.hp/G.st.maxHp;drawDarkness(hpR<0.35?(0.35-hpR)/0.35*(0.45+0.2*Math.sin(G.t*6)):0,z);
  ctx.setTransform(DPR*z,0,0,DPR*z,0,0);
  ctx.save();ctx.translate(-cx,-cy);
  ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';
  for(const t of G.texts){ctx.globalAlpha=Math.min(1,t.life*2.5);ctx.font=t.big?'bold 17px sans-serif':'bold 13px sans-serif';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;ctx.restore();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // 頭目方向箭頭
  for(const B of [G.boss,...G.minisAlive]){if(!B||B.dead)continue;const sx=(B.x-cx)*z,sy=(B.y-cy)*z;if(sx>0&&sx<VW&&sy>0&&sy<VH)continue;
    const a=Math.atan2(sy-VH/2,sx-VW/2);const ex=VW/2+Math.cos(a)*(Math.min(VW,VH)/2-40),ey=VH/2+Math.sin(a)*(Math.min(VW,VH)/2-40);
    ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle='#ff5252';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-10);ctx.lineTo(-8,10);ctx.fill();ctx.restore();}
  // 搖桿
  if(joy){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,50,0,7);ctx.stroke();const jx=joy.x-joy.ox,jy=joy.y-joy.oy,jl=Math.min(50,Math.hypot(jx,jy)),ja=Math.atan2(jy,jx);ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(joy.ox+Math.cos(ja)*jl,joy.oy+Math.sin(ja)*jl,20,0,7);ctx.fill();}
}

function endRun(win,retreat){
  if(G.over)return;G.over=true;closeModal();stopMusic();sfx(win?'victory':'gameover');
  const c=G.c,lm=lootMult(G.diff);const stg=G.stg;
  const baseGain=Math.round(G.metaExp*(win?1:0.6)*lm);const jobGain=Math.round(baseGain*0.6);
  const goldGain=G.gold+(win?120*(G.sIdx+1):0);
  const ilvl=Math.round(win?stg.lv[1]:enemyLevel());
  let nItems=(win?2:0)+Math.floor(G.kills/350*lm)+G.minisKilled;nItems=Math.min(nItems,10);
  const items=[];for(let i=0;i<nItems;i++){const slot=pick(['weapon','weapon','head','armor','shoes','acc']);items.push(genItem(slot,ilvl,rollRarity(lm)));}
  if(win){items.push(genItem(pick(['weapon','head','armor','shoes','acc']),ilvl+2,Math.random()<0.35?3:2));}
  // 局內撿到的裝備（地上沒撿的也一併帶回）
  for(const p of G.pk)if(p.type==='gear')G.gearFound.push(p.item);
  items.unshift(...G.gearFound);
  // 套用
  c.gold+=goldGain;c.bag.push(...items);
  for(const id of G.cardsFound)c.cards[id]=(c.cards[id]||0)+1;
  const oldB=c.baseLv,oldJ=c.jobLv;
  c.baseExp+=baseGain;while(c.baseLv<99&&c.baseExp>=baseNeed(c.baseLv)){c.baseExp-=baseNeed(c.baseLv);c.baseLv++;c.statPts+=5;}
  c.jobExp+=jobGain;while(c.jobLv<50&&c.jobExp>=jobNeed(c.jobLv)){c.jobExp-=jobNeed(c.jobLv);c.jobLv++;}
  c.rec.runs++;if(win)c.rec.wins++;c.rec.bestLv=Math.max(c.rec.bestLv,G.level);c.rec.kills+=G.kills;c.rec.time+=G.t;
  if(win){c.cleared[stg.id]=(c.cleared[stg.id]||0)+1;const prev=c.best[stg.id];if(!prev||G.t<prev)c.best[stg.id]=G.t;}
  c.shop=null;c.exch=null;
  let sold=0;while(c.bag.length>60){let mi=0;c.bag.forEach((it,i)=>{if(itemScore(it)<itemScore(c.bag[mi]))mi=i;});sold+=Math.round(itemScore(c.bag[mi])*1.5);c.bag.splice(mi,1);}c.gold+=sold;
  persist();
  const M=$('#modal');M.classList.remove('hidden');
  M.innerHTML=`<div class="win" style="width:min(620px,100%)"><div class="hd">${win?'🏆 勝利！':retreat?'🏳 撤退':'💀 倒下了'} — ${stg.name}</div><div class="bd">
    <div class="kv" style="margin-bottom:10px"><span>存活時間</span><b>${fmtT(G.t)}</b><span>本局等級</span><b>Lv ${G.level}</b><span>擊殺數</span><b>${G.kills}</b><span>難度戰利品倍率</span><b>×${lm.toFixed(2)}</b></div>
    <div class="card" style="margin-bottom:10px"><div class="kv"><span>Base EXP</span><b>+${baseGain}${c.baseLv>oldB?` <span class="up">升到 Lv ${c.baseLv}！</span>`:''}</b><span>Job EXP</span><b>+${jobGain}${c.jobLv>oldJ?` <span class="up">升到 Job ${c.jobLv}！</span>`:''}</b><span>金幣</span><b>+${goldGain}${sold?`（背包滿，自動賣出 +${sold}）`:''}</b></div></div>
    ${G.cardsFound.length?`<div class="card" style="margin-bottom:10px"><b>卡片</b><div class="mute">${G.cardsFound.map(id=>MON[id].name+' 卡片').join('、')}</div></div>`:''}
    <b>戰利品（${items.length}）</b><div style="margin-top:6px">${items.map(it=>`<div class="it q${it.rar}"><b>${itemTitle(it)}</b> <span class="gs">GS ${itemScore(it)}</span><div class="l">${SLOT_NAME[it.slot]} · ${itemLines(it).join(' · ')}</div></div>`).join('')||'<span class="mute">沒有獲得裝備</span>'}</div>
  </div><div class="ft"><span class="sp"></span><button id="backTown">返回城鎮</button></div></div>`;
  $('#backTown').onclick=()=>{closeModal();G=null;$('#hud').classList.add('hidden');$('#ui').classList.remove('hidden');screen='town';renderUI();};
}

/* ---- 精煉師：重新調整一條附加屬性，3 選 1，結果不會比原本差 ---- */
const REFINE_COST=100,Q_CAP=1.5;
function allItems(c){return [...SLOTS.map(([s])=>c.equip[s]).filter(Boolean),...c.bag];}
function affRange(k,ilvl){const [b,per]=AFFIX[k];return [b+ilvl*per*0.7,b+ilvl*per*1.2];}
function affVal(k,ilvl,q){const [a,b]=affRange(k,ilvl);const v=a+q*(b-a);return k==='regen'?Math.round(v*10)/10:Math.max(1,Math.round(v));}
function affQ(k,ilvl,v){const [a,b]=affRange(k,ilvl);return Math.max(0,(v-a)/Math.max(0.001,b-a));}
const qCol=q=>q<0.5?'#8bc34a':q<0.9?'#42a5f5':q<1.2?'#ce93d8':'#ffa726';
function rollRefine(it,idx){
  const cur=it.aff[idx];const q0=affQ(cur.k,it.ilvl,cur.v);
  const used=it.aff.filter((_,i)=>i!==idx).map(a=>a.k);
  const pool=Object.keys(AFFIX).filter(k=>!used.includes(k));
  const out=[],taken=new Set();
  for(let i=0;i<3;i++){
    let k,tries=0;do{k=pick(pool);tries++;}while(taken.has(k)&&tries<30);taken.add(k);
    const q=q0>=Q_CAP?q0:q0+Math.random()*(Q_CAP-q0);
    let v=affVal(k,it.ilvl,q);
    if(k===cur.k&&v<cur.v)v=cur.v;
    if(k!==cur.k)while(affQ(k,it.ilvl,v)<q0-1e-9)v=k==='regen'?Math.round((v+0.1)*10)/10:v+1;
    out.push({k,v,q:affQ(k,it.ilvl,v)});
  }
  return out;
}

      return winWrap('💎 精煉師',`<div class="it q${it.rar}"><b>${itemTitle(it)}</b><div class="l">要調整的屬性：<b>${modLabel(cur.k,cur.v)}</b>（品質 ${Math.round(q0*100)}%）</div></div>
        <h3 style="text-align:center;margin:14px 0 0">選擇一個結果</h3><div class="choices">${cards}</div><div class="mute" style="text-align:center">三個結果的品質都不低於原本。費用已支付，請選擇其中一個。</div>`,'<span class="sp"></span><span class="mute">必須選擇一個結果才會套用</span>',820);}}
  const all=allItems(c).filter(i=>i.aff.length).sort((a,b)=>b.rar-a.rar||itemScore(b)-itemScore(a));
  const sel=all.find(i=>i.uid===UI.rf)||all[0];if(sel)UI.rf=sel.uid;
  const list=all.map(it=>{const eq=SLOTS.some(([s])=>c.equip[s]===it);return `<div class="eq ${sel===it?'on':''}" data-rf="${it.uid}"><span class="nm">${itemTitle(it)}</span>${eq?'<span class="pill">已裝備</span>':''}<span class="sp"></span><span class="gs">${it.aff.length} 條</span></div>`;}).join('')||'<div class="mute">沒有帶附加屬性的裝備（普通品質沒有附加屬性）</div>';
  let det='';
  if(sel)det=`<div class="it q${sel.rar}"><b>${itemTitle(sel)}</b> <span class="gs">GS ${itemScore(sel)}</span><div class="l">${SLOT_NAME[sel.slot]} · Lv ${sel.ilvl}</div></div>
    <div class="card">${sel.aff.map((a,i)=>{const q=affQ(a.k,sel.ilvl,a.v);return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--panel2)"><b style="color:${qCol(q)}">${modLabel(a.k,a.v)}</b><span class="mute">品質 ${Math.round(q*100)}%</span><span class="sp"></span><button class="sm" data-rl="${i}" ${c.gold>=REFINE_COST?'':'disabled'}>精煉 🪙${REFINE_COST}</button></div>`;}).join('')}
    <div class="mute" style="margin-top:8px">每次精煉隨機產生 3 個結果（可能換成其他屬性），三選一，品質只會持平或更好，最高 ${Q_CAP*100}%。</div></div>`;
  return winWrap('💎 精煉師',`<div class="row" style="margin-bottom:8px"><span class="pill">🪙 ${c.gold}</span></div><div class="two"><div style="max-height:60vh;overflow:auto">${list}</div><div>${det}</div></div>`,'',900);
}

/* ---- 交易所：賣出裝備 / 購買 10 件（必出 1 傳說、2 史詩） ---- */
const sellPrice=it=>Math.round(itemScore(it)*1.5*[1,1,1.2,1.5,2][it.rar]);
const exPrice=it=>Math.round((itemScore(it)*6+20)*[1,1.2,1.5,2.5,4][it.rar]);
const exRefreshCost=c=>50*(1+Object.keys(c.cleared).length);
function genExchange(c){
  const il=shopLevel(c)+2;const rars=[4,3,3];
  while(rars.length<10)rars.push(Math.min(2,rollRarity(1)));
  rars.sort(()=>Math.random()-0.5);
  return rars.map(r=>{const it=genItem(pick(['weapon','head','armor','shoes','acc']),il,r);it.new=false;return it;});
}
function exHtml(){
  const c=curChar();if(!c.exch){c.exch=genExchange(c);persist();}
  const tab=UI.exTab||'buy';
  let body;
  if(tab==='buy'){
    body=c.exch.map((it,i)=>`<div class="it q${it.rar}"><div class="row"><b>${itemTitle(it)}</b><span class="gs r${it.rar}">${RARITY[it.rar].n}</span><span class="gs">${SLOT_NAME[it.slot]}</span><span class="gs">GS ${itemScore(it)}</span><span class="sp"></span><button class="sm" data-xb="${i}" ${c.gold>=exPrice(it)?'':'disabled'}>購買 🪙${exPrice(it)}</button></div><div class="l">Lv ${it.ilvl}${it.kind?' · '+{sword:'劍',bow:'弓',staff:'法杖'}[it.kind]:''} · ${itemLines(it).join(' · ')}</div></div>`).join('')||'<div class="mute">商品已全部售出，可以刷新或等下次遠征回來。</div>';
    body=`<div class="row" style="margin-bottom:8px"><span class="mute">每次遠征回來都會換一批 10 件（部位隨機），保證 1 件傳說、2 件史詩。</span><span class="sp"></span><button class="ghost sm" id="xRe" ${c.gold>=exRefreshCost(c)?'':'disabled'}>刷新 🪙${exRefreshCost(c)}</button></div>${body}`;
  }else{
    const list=c.bag.map((it,i)=>({it,i})).sort((a,b)=>b.it.rar-a.it.rar||itemScore(b.it)-itemScore(a.it));
    body=`<div class="row" style="margin-bottom:8px"><span class="mute">背包 ${c.bag.length} / 60（已裝備的物品不會出現在這裡）</span><span class="sp"></span><button class="ghost sm" data-xbulk="0">賣出全部普通</button><button class="ghost sm" data-xbulk="1">賣出全部精良以下</button></div>`+
      (list.map(({it,i})=>`<div class="it q${it.rar}"><div class="row"><b>${itemTitle(it)}</b><span class="gs r${it.rar}">${RARITY[it.rar].n}</span><span class="gs">${SLOT_NAME[it.slot]}</span><span class="gs">GS ${itemScore(it)}</span><span class="sp"></span><button class="ghost sm" data-xs="${i}">賣出 🪙${sellPrice(it)}</button></div><div class="l">Lv ${it.ilvl} · ${itemLines(it).join(' · ')}</div></div>`).join('')||'<div class="mute">背包是空的</div>');
  }
  return winWrap('⚖️ 交易所',`<div class="tabs"><button class="${tab==='buy'?'on':''}" data-xt="buy">購買</button><button class="${tab==='sell'?'on':''}" data-xt="sell">販售</button><span class="sp"></span><span class="pill">🪙 ${c.gold}</span></div>${body}`,'',860);
}
function bindEx(){const c=curChar();const M=$('#modal');const re=()=>{persist();openPanel('ex');};
  M.querySelectorAll('[data-xt]').forEach(b=>b.onclick=()=>{UI.exTab=b.dataset.xt;openPanel('ex');});
  M.querySelectorAll('[data-xb]').forEach(b=>b.onclick=()=>{const i=+b.dataset.xb;const it=c.exch[i];const p=exPrice(it);if(c.gold<p)return;if(c.bag.length>=60){toast('背包已滿');return;}
    c.gold-=p;it.new=true;c.bag.push(it);c.exch.splice(i,1);toast('已購買：'+it.name);sfx('buy');re();});
  M.querySelectorAll('[data-xs]').forEach(b=>b.onclick=()=>{const i=+b.dataset.xs;const it=c.bag[i];c.gold+=sellPrice(it);c.bag.splice(i,1);toast(`已賣出 +${sellPrice(it)}`);re();});
  M.querySelectorAll('[data-xbulk]').forEach(b=>b.onclick=()=>{const maxR=+b.dataset.xbulk;let g=0,n=0;c.bag=c.bag.filter(it=>{if(it.rar<=maxR){g+=sellPrice(it);n++;return false;}return true;});c.gold+=g;toast(`賣出 ${n} 件，獲得 ${g} 金幣`);re();});
  const r=$('#xRe');if(r)r.onclick=()=>{const rc=exRefreshCost(c);if(c.gold<rc)return;c.gold-=rc;c.exch=genExchange(c);re();};
}

/* ---- 紀錄 ---- */
function recHtml(){
  const c=curChar();const allCards=Object.keys(MON);const got=allCards.filter(id=>c.cards[id]);
  const stg=STAGES.map(s=>`<div class="eq"><b>${s.name}</b><span class="sp"></span>${c.cleared[s.id]?`<span class="up">通關 ${c.cleared[s.id]} 次 · 最快 ${fmtT(c.best[s.id])}</span>`:'<span class="mute">未通關</span>'}</div>`).join('');
  return winWrap('📜 事蹟記錄者',`<div class="two"><div><div class="card" style="margin-bottom:10px"><div class="kv"><span>遊玩次數</span><b>${c.rec.runs}</b><span>勝利</span><b>${c.rec.wins}</b><span>最佳本局等級</span><b>${c.rec.bestLv}</b><span>總擊殺</span><b>${c.rec.kills}</b><span>總遊玩時間</span><b>${fmtT(c.rec.time)}</b></div></div>${stg}</div>
   <div><b>卡片圖鑑 ${got.length} / ${allCards.length}</b><div class="mons" style="margin-top:8px">${allCards.map(id=>`<div class="m" style="${c.cards[id]?'':'opacity:.25;filter:grayscale(1)'}"><span data-mon="${id}"></span>${c.cards[id]?MON[id].name:'？？？'}</div>`).join('')}</div></div></div>`);
}

/* ---- 存檔 ---- */
function sysHtml(){
  return winWrap('💾 設定與存檔',`${audioControlsHtml()}<p class="mute">進度自動存在這台電腦的瀏覽器裡（localStorage）。換電腦或換瀏覽器前，請先匯出存檔碼。</p>
   <div class="row"><button id="exp1">匯出存檔碼</button><button class="ghost" id="dl1">下載存檔檔案</button></div>
   <textarea id="saveTxt" rows="6" style="margin-top:10px" placeholder="在這裡貼上存檔碼後按「匯入」"></textarea>
   <div class="row" style="margin-top:8px"><button class="ghost" id="imp1">匯入</button><span class="sp"></span><button class="danger" id="wipe">清除所有資料</button></div>`,'',640);
}
function bindSys(){
  bindAudioControls($('#modal'));
  const enc=()=>btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))));
  $('#exp1').onclick=()=>{$('#saveTxt').value=enc();$('#saveTxt').select();toast('已產生存檔碼，可複製保存');};
  $('#dl1').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([enc()],{type:'text/plain'}));a.download='星砂倖存者存檔.txt';a.click();};
  $('#imp1').onclick=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob($('#saveTxt').value.trim()))));if(!s.chars)throw 0;SAVE=s;persist();toast('匯入成功');screen='select';closePanel();}catch(e){toast('存檔碼格式錯誤');}};
  $('#wipe').onclick=()=>{if(confirm('確定清除所有角色與進度？此動作無法復原。')){SAVE=defaultSave();persist();screen='select';closePanel();}};
}

renderUI();
</script>
</body>
</html>
